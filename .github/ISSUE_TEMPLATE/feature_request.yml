name: "功能建议 / Feature request"
description: "写清目标型号、使用场景和你期望的行为 / Describe the target device, use case and behavior"
title: "[Feature] "
body:
  - type: input
    id: model
    attributes:
      label: "型号与原厂版本（如 V100F V1.03）/ Model and original version"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: "现在怎么操作、哪里不方便、希望改成什么样 / Current operation and desired behavior"
      description: "写清在哪个页面、哪个无线角色（机顶 / 主控 / 从属）下，现在要怎么操作、现有操作哪里影响使用，以及你期望的行为 / Include screen, role, trigger and the problem with the current operation."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "可用资料与验证条件 / Available evidence and testing setup"
      description: "已有的文档链接、固件文件名或 SHA、手头设备、能稳定复现的现象；没有可以不填 / Documents, image identity, devices or reproducible observations; optional."
